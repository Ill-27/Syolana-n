<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Проверка покупки Syolana</title><style>body{font:18px/1.6 system-ui,sans-serif;max-width:640px;margin:12vh auto;padding:24px;color:#17202b;background:#f5f7fb}a{color:#2456a6}</style></head><body><h1>Проверяем покупку</h1><p id="status" role="status">Ожидаем подтверждение оплаты от Robokassa…</p><a id="back" href="/">Вернуться в Syolana</a><script type="module">
const status=document.getElementById('status'),back=document.getElementById('back');
let pending;try{pending=JSON.parse(sessionStorage.getItem('syolana-pending-payment')||'null')}catch{}
if(!pending||!['en-a2','es-a1'].includes(pending.course)||!/^\d{1,19}$/.test(pending.invoice||'')){status.textContent='Вернитесь в курс и войдите в аккаунт покупки. Доступ открывается только после подтверждения оплаты.';}
else{back.href=pending.course==='en-a2'?'/#/lesson/en/a2/course':'/#/lesson/es/a1/course';back.textContent='Открыть мой курс';let attempts=0;async function check(){try{const r=await fetch('/api/course-access/'+pending.course+'/payment/'+pending.invoice,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(10000)});const data=await r.json();if(!r.ok)throw Error(data.error||'Проверка пока недоступна.');if(data.status==='paid'){status.textContent=data.test?'Тестовая оплата подтверждена. Настоящий курс не открывается в тестовом режиме.':data.access?'Оплата подтверждена. Курс открыт в вашем аккаунте.':'Оплата подтверждена. Обратитесь в поддержку по этому заказу.';sessionStorage.removeItem('syolana-pending-payment');return;}if(++attempts<20)setTimeout(check,3000);else status.textContent='Подтверждение ещё не поступило. Курс откроется после него; вы можете вернуться сюда позже.';}catch(error){status.textContent=error.message+' Войдите в аккаунт покупки и проверьте доступ в курсе.';}}check();}
</script></body></html>
