name: Set partner access

on:
  workflow_dispatch:
    inputs:
      partner_id:
        description: Partner ID
        required: true
        type: string
      active:
        description: Enable Syolana layer
        required: true
        type: choice
        options: ["true", "false"]
      hostname:
        description: Allowed hostname (optional when disabling)
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update entitlement registry
        env:
          PARTNER_ID: ${{ inputs.partner_id }}
          ACTIVE: ${{ inputs.active }}
          HOSTNAME: ${{ inputs.hostname }}
        run: node scripts/set-partner-access.mjs

      - name: Commit access change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "Syolana automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partners/entitlements.json
          git commit -m "Set partner access: ${{ inputs.partner_id }} -> ${{ inputs.active }}"
          git push
