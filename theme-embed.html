<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711}#starCanvas,.theme-world-canvas{position:fixed!important;inset:0!important;width:100%!important;height:100%!important}#ui{display:none}#flight-layer{position:fixed;inset:0;z-index:15;touch-action:none}.flight-hint{position:absolute;left:16px;right:16px;bottom:35px;text-align:center;color:white;font:12px system-ui;text-shadow:0 1px 4px #000}.mark{position:fixed;right:14px;bottom:10px;z-index:20;font:600 11px/1.2 system-ui,sans-serif;letter-spacing:.12em;color:rgba(255,255,255,.65);text-shadow:0 1px 8px #000;pointer-events:none}</style></head><body><canvas id="starCanvas" aria-hidden="true"></canvas><div id="reading-shade" aria-hidden="true"></div><div id="ui"><div class="top-actions"><button id="theme-toggle"></button></div><dialog id="theme-dialog"><div id="theme-list"></div></dialog><span id="theme-name"></span><div id="toast"></div></div><script type="module">
import {ThemeEngine} from './themes.js';
import {setupFlightLayer} from './flight.js';
const theme=new ThemeEngine({watermarks:'authorship',rememberTheme:true});let flight;
const publish=()=>{const vars={};for(const name of document.documentElement.style)if(name.startsWith('--'))vars[name]=document.documentElement.style.getPropertyValue(name);window.parent.postMessage({syolanaThemeState:true,theme:theme.id,vars},'*');};
theme.init().then(async()=>{flight=setupFlightLayer({theme,offers:[]});await import('./theme-sound.js');publish();}).catch(()=>{});
window.addEventListener('message',async event=>{if(event.source!==window.parent||!event.data?.syolanaEmbed)return;if(typeof event.data.zen==='boolean'){document.body.classList.toggle('zen',event.data.zen);theme.setZen(event.data.zen);if(flight)flight.hidden=!event.data.zen;}if(event.data.sound===true)document.getElementById('ambient-theme-sound-toggle')?.click();if(typeof event.data.theme==='string'&&theme.manifest?.some(t=>t.id===event.data.theme)){await theme.select(event.data.theme);publish();}});
window.addEventListener('syolana:scene-ready',publish);
</script></body></html>
