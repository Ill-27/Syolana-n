name: Check Syolana
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published website
        run: python tests/check_distribution.py .
      - name: Check published JavaScript
        run: |
          python tests/check_distribution.py . --javascript > /tmp/syolana-js-files.txt
          while IFS= read -r file; do node --check "$file"; done < /tmp/syolana-js-files.txt
      - name: Check theme geometry and continuous motion
        run: node tests/test_worlds.mjs
      - name: Check theme interactions and audio recovery
        run: node tests/test_theme_experience.mjs
      - name: Check flower control and theme text contrast
        run: node tests/test_bloom_controls.mjs
      - name: Check compact contemplation player and layout
        run: |
          node tests/test_player.mjs
          node tests/test_zen_layout.mjs
