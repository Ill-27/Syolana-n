name: Set partner access

on:
  workflow_dispatch:
    inputs:
      partner_id:
        description: "Partner ID from partners/entitlements.json"
        required: true
        type: string
      state:
        description: "Manual Syolana Core access"
        required: true
        type: choice
        options:
          - inactive
          - active

permissions:
  contents: write

jobs:
  set-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update entitlement
        run: node scripts/set-partner-access.mjs "${{ inputs.partner_id }}" "${{ inputs.state }}"
      - name: Commit switch
        shell: bash
        run: |
          if git diff --quiet -- partners/entitlements.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "Syolana access control"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partners/entitlements.json
          git commit -m "Set partner ${{ inputs.partner_id }} ${{ inputs.state }}"
          git push
