name: Check Syolana
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public artifacts
        run: |
          python scripts/build_en_a1.py
          python build.py
      - name: Player, catalog, scene audio and bundle tests
        run: |
          node tests/test_player.mjs
          node tests/test_catalog.mjs
          node tests/test_scene_audio.mjs
          node tests/test_build.mjs
          node tests/test_en_a1.mjs
      - name: Check JavaScript syntax
        run: |
          for file in *.js themes/*.js courses/en-a1/*.js dist/public/legacy-scripts/*.js; do node --check "$file"; done
